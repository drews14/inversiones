name: Informe diario

on:
  schedule:
    # GitHub usa UTC y a veces se salta o retrasa ejecuciones programadas.
    # Por eso hay varios intentos cada 20 minutos (L-V): el primero que cae entre las 6:30 y las 10:00
    # de Madrid genera el informe; los demás ven que ya existe y terminan en segundos.
    - cron: "10,30,50 4-8 * * 1-5"
  workflow_dispatch: {}       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ran: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Toca generar el informe?
        id: check
        run: |
          HM=$(TZ=Europe/Madrid date +%H%M)
          HOY=$(TZ=Europe/Madrid date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Lanzado a mano"
          elif [ -f "docs/data/history/$HOY.json" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "El informe de $HOY ya existe"
          elif [ "$HM" -lt 0630 ] || [ "$HM" -gt 1000 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Son las $HM en Madrid: fuera de la ventana 6:30-10:00"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Son las $HM en Madrid: genero el informe de $HOY"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Generar informe
        if: steps.check.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python screener/run.py --force
      - name: Guardar informe
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add docs/data data/isin.json
          git diff --cached --quiet || git commit -m "Informe $(TZ=Europe/Madrid date +%F)"
          git pull --rebase
          git push

  refrescar-indices:
    # El día 1 de cada mes actualiza la lista de empresas de cada índice
    needs: informe
    if: github.event_name == 'schedule' && needs.informe.outputs.ran == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref }}" }
      - run: |
          if [ "$(date +%d)" != "01" ]; then echo "No es día 1"; exit 0; fi
          git pull --rebase
          pip install pandas requests lxml html5lib beautifulsoup4
          python screener/universe.py
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add data/universe.csv
          git diff --cached --quiet || git commit -m "Actualizar componentes de índices"
          git push
