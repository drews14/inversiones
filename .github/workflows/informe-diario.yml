name: Informe diario

on:
  schedule:
    # GitHub usa UTC. Dos horarios para cubrir el horario de verano y el de invierno de Madrid;
    # el script solo continúa si en Madrid son las 7:xx (el informe queda listo antes de las 8:00).
    - cron: "40 5 * * 1-5"   # verano (CEST, UTC+2) -> 7:40 Madrid
    - cron: "40 6 * * 1-5"   # invierno (CET, UTC+1) -> 7:40 Madrid
  workflow_dispatch: {}       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar informe
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python screener/run.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Guardar informe
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Informe $(TZ=Europe/Madrid date +%F)"
          git push

  refrescar-indices:
    # El día 1 de cada mes actualiza la lista de empresas de cada índice
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: informe
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref }}" }
      - run: |
          if [ "$(date +%d)" != "01" ]; then echo "No es día 1"; exit 0; fi
          git pull --rebase
          pip install pandas requests lxml html5lib beautifulsoup4
          python screener/universe.py
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add data/universe.csv
          git diff --cached --quiet || git commit -m "Actualizar componentes de índices"
          git push
