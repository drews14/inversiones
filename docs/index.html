<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oportunidades">
<meta name="theme-color" content="#0b0f14">
<title>Oportunidades</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<header class="top">
  <div>
    <h1 id="title">Oportunidades</h1>
    <p id="subtitle" class="muted">Cargando informe…</p>
  </div>
  <div class="top-actions">
    <div class="mode" role="group" aria-label="Modo">
      <button data-mode="basico">Básico</button><button data-mode="experto">Experto</button>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Recargar">↻</button>
  </div>
</header>

<main>
  <section id="tab-hoy" class="tab active"></section>
  <section id="tab-mercados" class="tab"></section>
  <section id="tab-bolsas" class="tab"></section>
  <section id="tab-economia" class="tab"></section>
  <section id="tab-basico" class="tab"></section>
  <section id="tab-historico" class="tab"></section>
  <section id="tab-metodo" class="tab"></section>
</main>

<nav class="tabbar">
  <button data-tab="hoy" class="active"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoy</button>
  <button data-tab="mercados"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Mercados</button>
  <button data-tab="bolsas"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-9"/><path d="M14 6h6v6"/></svg>Bolsas</button>
  <button data-tab="economia"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="3" height="8"/><rect x="10.5" y="8" width="3" height="12"/><rect x="17" y="4" width="3" height="16"/></svg>Economía</button>
  <button data-tab="historico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
  <button data-tab="metodo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>Método</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-top"><div class="sheet-grip"></div><button class="sheet-close" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="gloss" class="gloss" hidden>
  <div class="gloss-card" role="dialog" aria-modal="true">
    <h4 id="gloss-title"></h4>
    <p id="gloss-text"></p>
    <button class="btn" id="gloss-ok">Entendido</button>
  </div>
</div>

<script src="glossary.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
